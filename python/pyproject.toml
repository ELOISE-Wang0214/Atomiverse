[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "atomiverse"
version = "0.1.0"
description = "Molecular simulation compute backend (CPU + optional CUDA)"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
molpy    = ["molpy"]
torch    = ["torch"]
dev      = ["pytest", "pytest-cov", "numpy"]
docs     = ["sphinx>=7", "furo", "myst-parser", "sphinx-copybutton"]
examples = ["matplotlib", "ase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source = ["src/atomiverse"]

# ── scikit-build-core ──────────────────────────────────────────────────────────

[tool.scikit-build]
# Pin behavior to this release's defaults even when upgrading the tool
minimum-version = "build-system.requires"

# CMakeLists.txt lives at the repo root, one level above python/
cmake.source-dir = ".."
cmake.build-type = "Release"

# Separate build tree for wheel builds (avoids collisions with dev builds in build/)
build-dir = "build/skbuild/{wheel_tag}"

# Python package source tree (src-layout)
wheel.packages = ["src/atomiverse"]

# Editable installs: redirect mode injects a finder that delegates to both
# the CMake install tree and the Python source tree
editable.mode = "redirect"
editable.rebuild = false
editable.verbose = true

# sdist: exclude generated and build artefacts
sdist.exclude = [
    "build/**",
    "docs/html/**",
    ".claude/**",
    "**/__pycache__/**",
]

# ── CMake defines (use cmake.define, not cmake.args, so they can be overridden
#    from the command line:  pip install -C cmake.define.ATV_BUILD_CUDA=ON .)
# ──────────────────────────────────────────────────────────────────────────────

[tool.scikit-build.cmake.define]
ATV_BUILD_PYTHON     = "ON"
ATV_BUILD_TESTS      = "OFF"
ATV_BUILD_BENCHMARKS = "OFF"
ATV_BUILD_EXAMPLES   = "OFF"
ATV_BUILD_PW         = {env = "ATV_BUILD_PW",  default = "OFF"}
ATV_BUILD_RHF        = {env = "ATV_BUILD_RHF", default = "ON"}

# Optional backends: driven by environment variable with a safe default
# Override: ATV_BUILD_CUDA=ON pip install .
ATV_BUILD_CUDA  = {env = "ATV_BUILD_CUDA",  default = "OFF"}
ATV_BUILD_TORCH = {env = "ATV_BUILD_TORCH", default = "OFF"}
ATV_USE_LIBXC   = {env = "ATV_USE_LIBXC",  default = "OFF"}

# Precision: float (default) or double
ATV_REAL = {env = "ATV_REAL", default = "float"}

# ── Environment-specific overrides ────────────────────────────────────────────

# CI wheel builds: enable full rebuild logging
[[tool.scikit-build.overrides]]
if.env.CIBUILDWHEEL = true
cmake.build-type = "Release"
