name: CI

# CPU build + our own unit-test suite (ctest). This workflow deliberately
# does NOT build or link any third-party comparison library (libxc via
# ATV_BUILD_XC_ORACLE, libcint via ATV_BUILD_LIBCINT) and does NOT run the
# QC benchmark-vs-PySCF binary — it builds Atomiverse and runs Atomiverse's
# own unit tests. The oracle/libcint-backed parity tests are developer
# tools, gated behind their CMake options and excluded from CI.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── CPU build + unit tests ────────────────────────────────────────────────
  # float  -> core + MD (RHF off; SCF asserts double-precision tolerances)
  # double -> full suite incl. SCF / hybrid DFT / vibrations (RHF on)
  cpu:
    name: CPU (${{ matrix.real }}, RHF ${{ matrix.rhf }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - real: float
            rhf: 'OFF'
          - real: double
            rhf: 'ON'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout molrs
        uses: actions/checkout@v4
        with:
          repository: MolCrafts/molrs
          path: molrs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cpu-${{ matrix.real }}-${{ hashFiles('CMakeLists.txt', 'molrs/Cargo.lock') }}

      - name: Configure
        run: |
          cmake -B build \
            -DATV_BUILD_CUDA=OFF \
            -DATV_BUILD_TESTS=ON \
            -DATV_BUILD_EXAMPLES=ON \
            -DATV_BUILD_RHF=${{ matrix.rhf }} \
            -DATV_REAL=${{ matrix.real }} \
            -DATV_MOLRS_PATH=${{ github.workspace }}/molrs

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test (our unit-test suite)
        run: ctest --test-dir build -j$(nproc) --output-on-failure

  # ── Format check ──────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout molrs
        uses: actions/checkout@v4
        with:
          repository: MolCrafts/molrs
          path: molrs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust format (molrs-cxxapi)
        run: cargo fmt --check --manifest-path molrs/molrs-cxxapi/Cargo.toml

      - name: Check C++ format
        uses: jidicula/clang-format-action@v4.13.0
        with:
          clang-format-version: '17'
          check-path: 'include src'
          fallback-style: 'LLVM'

  # ── Documentation build ───────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Build docs
        run: |
          cmake -B build/docs -DATV_DOCS_ONLY=ON
          cmake --build build/docs --target docs

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-docs
          path: docs/html/
          retention-days: 7
