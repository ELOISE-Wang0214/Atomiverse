name: CI

# Intentionally NOT on push/PR. Local pre-commit / pre-push is the gate:
#   pre-commit  → format / hygiene
#   pre-push    → tools/ci_cpu_unit.sh  (cmake + unit ctest)
# Multi-backend (CUDA etc.) is machine-local (login node / GPU job), not
# GitHub-hosted. Manual re-run only when you want a second opinion:
#   gh workflow run CI.yml
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  cpu:
    name: CPU unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4

      - name: Read molrs pin
        id: molrs
        run: |
          ref=$(sed -n 's/.*set(ATV_MOLRS_GIT_REF "\([^"]*\)".*/\1/p' cmake/MolrsContract.cmake | head -1)
          if [ -z "$ref" ]; then
            echo "Failed to parse ATV_MOLRS_GIT_REF from cmake/MolrsContract.cmake" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "molrs pin: $ref"

      - name: Checkout molrs
        uses: actions/checkout@v4
        with:
          repository: MolCrafts/molrs
          ref: ${{ steps.molrs.outputs.ref }}
          path: molrs

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev

      - name: CPU unit (same script as local pre-push)
        env:
          ATV_MOLRS_PATH: ${{ github.workspace }}/molrs
          ATV_CI_BUILD_DIR: build
        run: bash tools/ci_cpu_unit.sh
