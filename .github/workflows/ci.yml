name: CI

# Local:  pre-commit run --all-files
# Remote: same hooks, then one CPU cmake + unit ctest.
# No matrix, no acceptance, no MPI gate, no regressions-as-gate, no benchmarks.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  cpu:
    name: CPU unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4

      - name: Read molrs pin
        id: molrs
        run: |
          # Single source of truth: cmake/MolrsContract.cmake ATV_MOLRS_GIT_REF
          ref=$(sed -n 's/.*set(ATV_MOLRS_GIT_REF "\([^"]*\)".*/\1/p' cmake/MolrsContract.cmake | head -1)
          if [ -z "$ref" ]; then
            echo "Failed to parse ATV_MOLRS_GIT_REF from cmake/MolrsContract.cmake" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "molrs pin: $ref"

      - name: Checkout molrs
        uses: actions/checkout@v4
        with:
          repository: MolCrafts/molrs
          ref: ${{ steps.molrs.outputs.ref }}
          path: molrs

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DATV_BUILD_CUDA=OFF \
            -DATV_BUILD_TORCH=OFF \
            -DATV_BUILD_TESTS=ON \
            -DATV_BUILD_EXAMPLES=OFF \
            -DATV_BUILD_RHF=ON \
            -DATV_REAL_STORAGE=double \
            -DATV_MOLRS_PATH=${{ github.workspace }}/molrs

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Unit tests
        # tests/ only. no_alloc is runtime-dependent (glibc/libgomp) — not a portable gate.
        run: ctest --test-dir build -j$(nproc) --output-on-failure -E 'no_alloc'
