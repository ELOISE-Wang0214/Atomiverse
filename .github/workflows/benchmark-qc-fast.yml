name: Benchmark QC fast

# Phase 1.2 acceptance runner. Runs LBFGS + SCFEvaluator (CPU SCF) at the
# level of theory encoded in each checked-in reference JSON, on the three
# smallest molecules by default to keep push-time feedback under ~1 min.
# Nightly runs the full 12-molecule suite (bench_qc_suite with no stems).

on:
  push:
    branches: [master, dev]
    paths:
      - 'src/cpu/scf/**'
      - 'src/cpu/minimizer/**'
      - 'include/atomiverse/cpu/scf/**'
      - 'include/atomiverse/cpu/minimizer/**'
      - 'benchmarks/qc/**'
  pull_request:
    paths:
      - 'src/cpu/scf/**'
      - 'src/cpu/minimizer/**'
      - 'include/atomiverse/cpu/scf/**'
      - 'include/atomiverse/cpu/minimizer/**'
      - 'benchmarks/qc/**'
  schedule:
    # 09:00 UTC nightly -> runs the full suite via the "nightly" job.
    - cron: '0 9 * * *'

jobs:
  fast:
    name: bench-qc-fast (h2o/nh3/ch4)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout molrs
        uses: actions/checkout@v4
        with:
          repository: MolCrafts/molrs
          path: molrs

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DATV_BUILD_CUDA=OFF \
            -DATV_BUILD_BENCHMARKS=ON \
            -DATV_BUILD_RHF=ON \
            -DATV_REAL=double \
            -DATV_MOLRS_PATH=${{ github.workspace }}/molrs

      - name: Build bench_qc_suite
        run: cmake --build build -j$(nproc) --target bench_qc_suite

      - name: Run (fast set)
        run: ./build/benchmarks/bench_qc_suite h2o nh3 ch4

  nightly:
    name: bench-qc-full (all checked-in refs)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout molrs
        uses: actions/checkout@v4
        with:
          repository: MolCrafts/molrs
          path: molrs

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DATV_BUILD_CUDA=OFF \
            -DATV_BUILD_BENCHMARKS=ON \
            -DATV_BUILD_RHF=ON \
            -DATV_REAL=double \
            -DATV_MOLRS_PATH=${{ github.workspace }}/molrs

      - name: Build bench_qc_suite
        run: cmake --build build -j$(nproc) --target bench_qc_suite

      - name: Run (full suite)
        run: ./build/benchmarks/bench_qc_suite
