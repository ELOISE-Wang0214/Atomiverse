name: Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'benchmarks/**'

jobs:
  bench:
    name: Benchmark (CUDA)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Checkout molrs
        uses: actions/checkout@v4
        with:
          repository: MolCrafts/molrs
          path: molrs

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DATV_BUILD_CUDA=ON \
            -DATV_BUILD_BENCHMARKS=ON \
            -DATV_BUILD_RHF=ON \
            -DATV_REAL=float \
            -DATV_MOLRS_PATH=${{ github.workspace }}/molrs

      - name: Build
        run: cmake --build build -j$(nproc) --config Release

      - name: Run benchmarks
        run: |
          ./build/benchmarks/bench_md_step --benchmark_format=json > bench_md.json || true
          ./build/benchmarks/bench_scf --benchmark_format=json > bench_scf.json || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench_*.json
          retention-days: 30
