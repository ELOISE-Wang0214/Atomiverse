name: Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'benchmarks/**'

jobs:
  bench:
    name: Benchmark (CUDA)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Checkout molrs
        uses: actions/checkout@v4
        with:
          repository: MolCrafts/molrs
          path: molrs

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DATV_BUILD_CUDA=ON \
            -DATV_BUILD_BENCHMARKS=ON \
            -DATV_BUILD_RHF=ON \
            -DATV_MOLRS_PATH=${{ github.workspace }}/molrs

      - name: Build
        run: cmake --build build -j$(nproc) --config Release

      - name: Run benchmarks
        run: |
          # google-benchmark targets that actually exist (see
          # benchmarks/CMakeLists.txt): bench_md_step (CUDA MD step) and
          # bench_native (native ERI/integral kernel, gated by ATV_BUILD_RHF,
          # which is ON above). The old `bench_scf` target never existed and
          # its `|| true` silently swallowed the missing-binary failure — a
          # broken benchmark job that always went green. No `|| true`: a real
          # build/run failure must fail the job.
          ./build/benchmarks/bench_md_step --benchmark_format=json > bench_md_step.json
          ./build/benchmarks/bench_native  --benchmark_format=json > bench_native.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench_*.json
          retention-days: 30
