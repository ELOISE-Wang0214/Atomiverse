# Pre-commit gate for Atomiverse, aligned with .github/workflows/ci.yml.
#
# CI's heavy gate (CMake build + the ctest matrix) cannot run per-commit,
# so this config covers the fast static half: C++/CUDA formatting via the
# repo's pinned .clang-format, workflow-YAML validity, and file hygiene.
# clang-format is pinned to the same major.minor as the local toolchain
# (clang-format 22.1.x) so results are reproducible across machines.
#
# The pre-existing tree is not yet fully format-clean; hooks run only on
# the files each commit touches, so formatting converges incrementally —
# do not run `pre-commit run --all-files` on a dirty working tree.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        types_or: [c, c++, cuda]
